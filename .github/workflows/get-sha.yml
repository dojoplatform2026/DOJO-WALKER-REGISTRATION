name: Get Android SHA

on:
  workflow_dispatch:

jobs:
  sha:
    name: Generate SHA-1 and SHA-256
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Show SHA fingerprints
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

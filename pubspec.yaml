name: dojo_walker_registration
description: Dojo Walker Registration and Verification Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.5

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.2

  shared_preferences: ^2.5.3

  image_picker: ^1.2.0

  permission_handler: ^12.0.1

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/dojo_walker_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E86100"
  adaptive_icon_foreground: "assets/dojo_walker_app_icon.png"
